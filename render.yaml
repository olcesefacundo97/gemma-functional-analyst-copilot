services:
  - type: web
    name: gemma-functional-analyst-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: AI_PROVIDER
        value: google
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
